[build-system]
requires = [
    "setuptools>=61",
    "wheel",
    "cython",
    "scipy",
    "numpy",
    "polars",
    "rich_click",
]
build-backend = "setuptools.build_meta"

[project]
name = "cointf"
description = "Package for inferring parameters of crossover interference from data."
keywords = ["haplotypes", "recombination", "phasing"]
classifiers = ["Development Status :: 3 - Alpha", "Intended Audience :: Science/Research", "Programming Language :: Python :: 3"]
requires-python = ">= 3.11"
dependencies = ["numpy", "scipy", "polars", "Cython", "rich_click"]
dynamic = ["version"]
authors = [{name = "Arjun Biddanda", email = "aabiddanda@gmail.com"}]

[project.urls]
Homepage = "https://github.com/aabiddanda/cointf"

[project.optional-dependencies]
tests = [ "pytest", "pytest-cov", "hypothesis", "pytest-xdist"]

[project.scripts]
cointf = "cointf.cli:main"

[tool.setuptools]
zip-safe = false
include-package-data = false

[tool.setuptools.packages.find]
namespaces = false

[tool.setuptools.dynamic.version]
attr = "cointf.__version__"

[tool.cython-lint]
max-line-length = 180
ignore = ['E501','E503', 'E504']

[tool.ruff.lint]
ignore = ["E731", "F401"] # Specific errors to ignore globally
