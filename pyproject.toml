[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cointf"
description = "Fast, exact likelihoods for the Housworth-Stahl model of crossover interference."
keywords = ["recombination", "crossover interference", "likelihood", "meiosis"]
classifiers = ["Development Status :: 3 - Alpha", "Intended Audience :: Science/Research", "Programming Language :: Python :: 3"]
requires-python = ">= 3.11"
dependencies = ["numpy", "scipy"]
dynamic = ["version"]
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Arjun Biddanda", email = "aabiddanda@gmail.com"}]

[project.urls]
Homepage = "https://github.com/aabiddanda/cointf"

[project.optional-dependencies]
tests = [ "pytest", "pytest-cov", "hypothesis", "pytest-xdist"]

[tool.setuptools]
zip-safe = false
include-package-data = false

[tool.setuptools.packages.find]
namespaces = false

[tool.setuptools.dynamic.version]
attr = "cointf.__version__"

[tool.ruff.lint]
ignore = ["E731", "F401"] # Specific errors to ignore globally
