# Build the Sphinx site and publish it to GitHub Pages on every push to main.
# Run it by hand with: gh workflow run docs.yml --ref main
#
# The R reference (docs/api/r.md) is committed, so R is not needed here;
# regenerate it locally with docs/api/make_r_reference.R after changing roxygen comments.

name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install cointf with the docs extra
        run: pip install ".[docs]"
      - name: Build the site, failing on any warning or broken reference
        run: sphinx-build -n -W --keep-going -b html docs docs/_build/html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
